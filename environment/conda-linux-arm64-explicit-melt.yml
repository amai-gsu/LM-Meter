name: melt env
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python stack
  - python=3.11.11
  - pip=25.0.1
  - setuptools=78.1.0
  - wheel=0.45.1
  - cython=3.0.12
  - cmake=3.31.6
  - git=2.49.0

  # Common libraries
  - numpy=1.24.*
  - scipy
  - pandas=2.2.*
  - psutil=7.0.0
  - packaging=25.0
  - decorator=5.2.1
  - pygments=2.19.1
  - traitlets=5.14.3
  - typing_extensions=4.13.2
  - six=1.17.0
  - zipp=3.21.0

  # jupyter/ipython
  - ipython=9.1.0
  - ipykernel=6.29.5
  - jupyter_core=5.7.2
  - jupyter_client=8.6.3
  - matplotlib-inline=0.1.7
  - prompt-toolkit=3.0.51
  - python-dateutil=2.9.0.post0
  - pyzmq=26.4.0
  - stack_data=0.6.3
  - jedi=0.19.2
  - nest-asyncio=1.6.0

  # Debug/parse utilities
  - asttokens=3.0.0
  - exceptiongroup=1.2.2
  - executing=2.1.0
  - parso=0.8.4
  - pickleshare=0.7.5
  - pure_eval=0.2.3
  - ptyprocess=0.7.0

  # LLVM toolchain (use 20.x to match your kernel env)
  - libllvm20=20.1.2
  - llvm-tools-20=20.1.2
  - llvmdev=20.1.2
  - llvm-openmp=20.1.2

  # System dependencies
  - bzip2=1.0.8
  - ca-certificates=2025.4.26
  - gettext
  - libintl=0.23.1
  - icu=75.1
  - libdeflate=1.24
  - libffi=3.4.6
  - libiconv=1.18
  - libjpeg-turbo=3.1.0
  - libpng=1.6.47
  - libsqlite=3.49.1
  - libxml2=2.13.8
  - openssl=3.5.0
  - pcre2=10.44
  - readline=8.2
  - tk=8.6.13
  - tzdata=2025b
  - zstd=1.5.7
  - krb5=1.21.3
  - libglib=2.84.0
  - libnghttp2=1.64.0
  - libssh2=1.11.1
  - libcurl=8.13.0
  - libzlib=1.3.1
  - libexpat=2.7.0
  - libev=4.33
  - ncurses=6.5

  # Font support
  - fontconfig=2.15.0
  - freetype=2.13.3
  - fonts-conda-forge=1
  - fonts-conda-ecosystem=1

  # Scientific/plotting stack
  # If it conflicts, comment it out first and install it separately later.
  - matplotlib=3.10.*
  - contourpy
  - pillow
  - graphviz=12.0.0
  - python-graphviz=0.20.3
  - cairo=1.18.4
  - harfbuzz=11.1.0
  - pango=1.56.3
  - fribidi=1.0.10
  - gts=0.7.6
  - librsvg=2.58.4
  - gtk2=2.24.33
  - libgd=2.3.3
  - gdk-pixbuf=2.42.12
